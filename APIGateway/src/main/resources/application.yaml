server:
  port: 8080

spring:
  application:
    name: APIGateway

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/user/**

        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/order/**

        - id: payment-service
          uri: http://localhost:8083
          predicates:
            - Path=/payment/**  


gateway:
  secret: my-secret-key-123              
